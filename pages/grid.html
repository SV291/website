    <main>

        
        <section class="composition">
            <h2>5</h2>

            <div class="grid grid-main">
                <div class="block main-block">1</div>
                <div class="block top-left">2</div>
                <div class="block top-right">3</div>
                <div class="block middle-left">4</div>
                <div class="block middle-right">5</div>
                <div class="block bottom-block">6</div>
            </div>
        </section>


        <section class="composition">
            <h2>4</h2>

            <div class="grid grid-sidebar">
                <div class="block top-left">1</div>
                <div class="block top-middle">2</div>
                <div class="block large-block">3</div>
                <div class="block middle-left">4</div>
                <div class="block middle-middle">5</div>
                <div class="block bottom-left">6</div>
                <div class="block bottom-right">7</div>
            </div>
        </section>


        <section class="composition">
            <h2>3</h2>

            <div class="grid grid-alternating">
                <div class="block wide-left">1</div>
                <div class="block small-top">2</div>
                <div class="block small-right">3</div>
                <div class="block small-left">4</div>
                <div class="block wide-middle">5</div>
                <div class="block small-bottom">6</div>
            </div>
        </section>


        <section class="composition">
            <h2>2</h2>

            <div class="grid grid-tall-left">
                <div class="block tall-block">1</div>
                <div class="block top-middle">2</div>
                <div class="block top-right">3</div>
                <div class="block middle-middle">4</div>
                <div class="block middle-right">5</div>
                <div class="block bottom-block">6</div>
            </div>
        </section>



        <section class="composition">
            <h2>1</h2>

            <div class="grid grid-rows">
                <div class="block narrow-top">1</div>
                <div class="block wide-top">2</div>
                <div class="block wide-middle">3</div>
                <div class="block narrow-middle">4</div>
                <div class="block bottom-block">5</div>
            </div>
        </section>
